[package]
name = "rate-lens"
version = "0.1.0"
edition = "2024"
description = "Estimate the effective multiplier charged by OpenAI Responses and Anthropic Messages API relays"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.4"
rust_decimal = { version = "1.37", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
